<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 석식 패스</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsQR 스캐너 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <!-- Firebase SDK (Modular CDN) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD1QMc6FSNZxF4zu--dkcniXkXMLtzN5DA",
        authDomain: "smartmealpass-2e138.firebaseapp.com",
        projectId: "smartmealpass-2e138",
        storageBucket: "smartmealpass-2e138.firebasestorage.app",
        messagingSenderId: "920000501267",
        appId: "1:920000501267:web:c8c06d437a7c11f38c91e6",
        measurementId: "G-5GE5DESWM5"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.db = db;
      window.auth = auth;
      window.firebaseModules = { collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc };

      window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      body { font-family: 'Pretendard', sans-serif; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center justify-start">

    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-2xl shadow-xl z-50 text-white font-bold transition-all duration-300 opacity-0 pointer-events-none text-sm flex items-center gap-2">
      <span id="toast-icon"></span>
      <span id="toast-msg"></span>
    </div>

    <!-- 메인 앱 컨테이너 (컴퓨터/태블릿은 와이드 반응형, 모바일은 꽉 찬 화면) -->
    <div id="app" class="w-full max-w-full md:max-w-6xl min-h-screen flex flex-col bg-white md:bg-transparent shadow-sm md:shadow-none md:p-6">
      <!-- 초기 로딩 화면 -->
      <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center p-8 space-y-4 bg-white rounded-3xl md:shadow-sm">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-gray-500 font-bold text-sm">클라우드 서버 연결 중...</p>
      </div>
    </div>

    <script>
      let currentUser = null;
      let allUsers = [];
      let todayAttendance = [];
      let unsubscribeUsers = null;
      let unsubscribeAttendance = null;

      const getTodayStr = () => {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}${month}${day}`;
      };

      const getTodayDayOfWeek = () => {
        return new Date().getDay(); // 0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
      };

      window.addEventListener('firebase-ready', async () => {
        const { auth, db, firebaseModules } = window;
        const { collection, onSnapshot } = firebaseModules;

        try {
          await signInAnonymously(auth);
        } catch (e) {
          console.error("Auth error:", e);
        }

        // 1. 학생 데이터 실시간 동기화
        const usersRef = collection(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', 'meal_users');
        unsubscribeUsers = onSnapshot(usersRef, (snapshot) => {
          allUsers = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
          if (currentUser) {
            renderApp();
          } else {
            renderLogin();
          }
        }, (err) => {
          console.error("Users sync error:", err);
          renderLogin();
        });

        // 2. 오늘 출석 데이터 실시간 동기화
        const todayStr = getTodayStr();
        const attRef = collection(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', `meal_attendance_${todayStr}`);
        unsubscribeAttendance = onSnapshot(attRef, (snapshot) => {
          todayAttendance = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
          if (currentUser) renderApp();
        });
      });

      function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');
        
        toastMsg.textContent = msg;
        toastIcon.innerHTML = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
        
        toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-2xl shadow-xl z-50 text-white font-bold transition-all duration-300 opacity-100 text-sm flex items-center gap-2 ${type === 'success' ? 'bg-blue-600' : 'bg-red-500'}`;
        
        setTimeout(() => {
          toast.className = "fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-2xl shadow-xl z-50 text-white font-bold transition-all duration-300 opacity-0 pointer-events-none text-sm flex items-center gap-2";
        }, 3000);
      }

      function renderLogin() {
        const appEl = document.getElementById('app');
        appEl.innerHTML = `
          <div class="min-h-screen md:min-h-[80vh] flex flex-col items-center justify-center p-6 bg-white md:bg-transparent">
            <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl w-full max-w-md border border-gray-100">
              <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                  <i class="fa-solid fa-qrcode text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">스마트 석식 패스</h1>
                <p class="text-gray-400 text-sm mt-1 font-medium">학교 급식실 QR 인증 시스템</p>
              </div>

              <form id="login-form" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1 uppercase tracking-wider">학번</label>
                  <input type="text" id="login-id" class="w-full px-4 py-4 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800 transition" placeholder="학번을 입력하세요 (예: 30101)" required />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-1.5 ml-1 uppercase tracking-wider">비밀번호</label>
                  <input type="password" id="login-pw" class="w-full px-4 py-4 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800 transition" placeholder="비밀번호를 입력하세요" required />
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition mt-2">
                  로그인하기
                </button>
              </form>
            </div>
          </div>
        `;

        document.getElementById('login-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const id = document.getElementById('login-id').value.trim();
          const pw = document.getElementById('login-pw').value.trim();

          // 관리자 로그인 체크
          if (id === 'ysj0518' && pw === 'ysj0518!') {
            currentUser = { role: 'admin', name: '관리자 선생님', id: 'ysj0518' };
            renderApp();
            showToast('관리자 계정으로 로그인되었습니다.');
            return;
          }

          // 학생 로그인 체크
          const student = allUsers.find(u => u.role === 'student' && u.id === id && u.password === pw);
          if (student) {
            currentUser = student;
            renderApp();
            showToast(`${student.name} 학생 환영합니다!`);
          } else {
            showToast('학번 또는 비밀번호가 일치하지 않습니다.', 'error');
          }
        });
      }

      function renderApp() {
        if (!currentUser) { renderLogin(); return; }
        if (currentUser.role === 'admin') {
          renderAdminDashboard();
        } else {
          renderStudentDashboard();
        }
      }

      function renderAdminDashboard() {
        window.activeAdminTab = window.activeAdminTab || 'scanner';
        window.statViewMode = window.statViewMode || 'ate'; // 'target', 'ate', 'notAte'

        const appEl = document.getElementById('app');
        appEl.innerHTML = `
          <div class="min-h-screen bg-white md:bg-white md:rounded-[2rem] md:shadow-xl md:border md:border-gray-100 flex flex-col overflow-hidden mb-8">
            <!-- 상단 헤더 -->
            <header class="bg-white px-6 py-4 border-b border-gray-100 flex justify-between items-center sticky top-0 z-20">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 font-bold">
                  <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                  <h1 class="font-extrabold text-gray-900 text-lg">관리자 모드</h1>
                  <p class="text-xs text-gray-400 font-semibold">급식실 통합 관리 시스템</p>
                </div>
              </div>
              <button id="logout-btn" class="px-4 py-2 bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-600 rounded-xl font-bold text-sm transition">
                로그아웃
              </button>
            </header>

            <!-- 탭 네비게이션 -->
            <div class="p-4 bg-gray-50/50 border-b border-gray-100 flex gap-2 overflow-x-auto hide-scrollbar md:px-6">
              <button onclick="switchAdminTab('scanner')" class="admin-tab-btn px-5 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 transition whitespace-nowrap ${window.activeAdminTab === 'scanner' ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200/60'}">
                <i class="fa-solid fa-qrcode"></i> QR 스캐너
              </button>
              <button onclick="switchAdminTab('students')" class="admin-tab-btn px-5 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 transition whitespace-nowrap ${window.activeAdminTab === 'students' ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200/60'}">
                <i class="fa-solid fa-users"></i> 학생 관리
              </button>
              <button onclick="switchAdminTab('stats')" class="admin-tab-btn px-5 py-3 rounded-2xl font-bold text-sm flex items-center gap-2 transition whitespace-nowrap ${window.activeAdminTab === 'stats' ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200/60'}">
                <i class="fa-solid fa-chart-pie"></i> 급식 현황
              </button>
            </div>

            <!-- 컨텐츠 영역 -->
            <div class="flex-1 p-4 sm:p-6 md:p-8 max-w-5xl mx-auto w-full">
              <!-- QR 스캐너 탭 -->
              <div id="tab-scanner" class="admin-tab-content ${window.activeAdminTab === 'scanner' ? '' : 'hidden'} grid md:grid-cols-2 gap-6 items-start">
                <div class="bg-gray-50/60 p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center">
                  <div id="scanner-view-container" class="w-full flex flex-col items-center">
                    <div id="camera-box" class="relative w-full aspect-square bg-gray-900 rounded-2xl overflow-hidden shadow-inner mb-4 hidden">
                      <video id="qr-video" class="w-full h-full object-cover" autoplay playsinline muted></video>
                      <canvas id="qr-canvas" class="hidden"></canvas>
                      <div class="absolute inset-0 border-4 border-blue-500/40 m-6 rounded-xl pointer-events-none animate-pulse"></div>
                    </div>
                    <div id="camera-placeholder" class="w-full aspect-square bg-white border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 mb-4">
                      <i class="fa-solid fa-camera text-4xl mb-2 text-gray-300"></i>
                      <p class="text-xs font-bold text-gray-400">카메라를 켜서 QR코드를 스캔하세요</p>
                    </div>
                    <button id="toggle-cam-btn" class="w-full py-4 bg-gray-900 hover:bg-gray-800 text-white font-extrabold rounded-2xl transition shadow-md">
                      카메라 켜기
                    </button>
                  </div>

                  <div id="pending-card" class="w-full bg-blue-50 border-2 border-blue-200 rounded-3xl p-6 text-center hidden">
                    <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-200">
                      <i class="fa-solid fa-user-check text-2xl"></i>
                    </div>
                    <h3 id="pending-name" class="text-xl font-extrabold text-blue-900"></h3>
                    <p id="pending-id" class="text-sm font-semibold text-blue-600 mb-6"></p>
                    <div class="grid grid-cols-2 gap-3">
                      <button id="confirm-eat-btn" class="py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md">식사 완료 확인</button>
                      <button id="cancel-eat-btn" class="py-3.5 bg-white border border-gray-200 text-gray-600 font-bold rounded-xl">취소</button>
                    </div>
                  </div>
                </div>

                <div class="bg-gray-50/60 p-6 rounded-3xl shadow-sm border border-gray-100">
                  <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">수동 입력 테스트</h3>
                  <div class="flex gap-2">
                    <input type="text" id="manual-scan-input" placeholder="스캔용 텍스트 입력" class="flex-1 px-4 py-3 bg-white rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" />
                    <button id="manual-scan-submit" class="px-5 py-3 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl text-sm">확인</button>
                  </div>
                </div>
              </div>

              <!-- 학생 관리 탭 -->
              <div id="tab-students" class="admin-tab-content ${window.activeAdminTab === 'students' ? '' : 'hidden'} grid md:grid-cols-2 gap-6 items-start">
                <div class="bg-gray-50/60 p-6 rounded-3xl shadow-sm border border-gray-100">
                  <h2 class="font-extrabold text-gray-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-blue-600"></i> 신규 학생 등록
                  </h2>
                  <form id="add-student-form" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">학번</label>
                        <input type="text" id="new-id" placeholder="예: 30101" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" required />
                      </div>
                      <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">이름</label>
                        <input type="text" id="new-name" placeholder="홍길동" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" required />
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">비밀번호</label>
                      <input type="password" id="new-pw" placeholder="비밀번호 설정" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" required />
                    </div>
                    
                    <!-- 요일별 자습 설정 체크박스 (월, 화, 수, 목) -->
                    <div class="pt-1">
                      <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">자습(석식) 요일 선택 (월~목)</label>
                      <div class="grid grid-cols-4 gap-2">
                        <label class="flex items-center justify-center gap-1.5 p-3 bg-white border border-gray-200 rounded-xl font-bold text-xs cursor-pointer hover:bg-blue-50 transition has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600">
                          <input type="checkbox" name="study-day" value="1" class="hidden" checked /> 월요일
                        </label>
                        <label class="flex items-center justify-center gap-1.5 p-3 bg-white border border-gray-200 rounded-xl font-bold text-xs cursor-pointer hover:bg-blue-50 transition has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600">
                          <input type="checkbox" name="study-day" value="2" class="hidden" checked /> 화요일
                        </label>
                        <label class="flex items-center justify-center gap-1.5 p-3 bg-white border border-gray-200 rounded-xl font-bold text-xs cursor-pointer hover:bg-blue-50 transition has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600">
                          <input type="checkbox" name="study-day" value="3" class="hidden" checked /> 수요일
                        </label>
                        <label class="flex items-center justify-center gap-1.5 p-3 bg-white border border-gray-200 rounded-xl font-bold text-xs cursor-pointer hover:bg-blue-50 transition has-[:checked]:bg-blue-600 has-[:checked]:text-white has-[:checked]:border-blue-600">
                          <input type="checkbox" name="study-day" value="4" class="hidden" checked /> 목요일
                        </label>
                      </div>
                    </div>

                    <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition mt-2">
                      학생 등록하기
                    </button>
                  </form>
                </div>

                <div class="bg-gray-50/60 p-6 rounded-3xl shadow-sm border border-gray-100">
                  <h2 class="font-extrabold text-gray-900 mb-4">등록된 학생 명단 (<span id="student-count">0</span>명)</h2>
                  <div id="student-list-container" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1"></div>
                </div>
              </div>

              <!-- 급식 현황 탭 -->
              <div id="tab-stats" class="admin-tab-content ${window.activeAdminTab === 'stats' ? '' : 'hidden'} space-y-6">
                <div class="grid grid-cols-3 gap-3 md:gap-4">
                  <!-- 오늘 자습 대상 카드 (클릭 가능) -->
                  <div id="card-target" class="p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition border border-gray-100 shadow-sm ${window.statViewMode === 'target' ? 'bg-indigo-600 text-white ring-2 ring-indigo-600 shadow-indigo-200' : 'bg-gray-50/60 text-gray-800 hover:bg-gray-100'}">
                    <p class="text-xs font-bold opacity-75 mb-1">오늘 자습대상</p>
                    <p class="text-2xl md:text-3xl font-extrabold"><span id="stat-target-count">0</span><span class="text-sm font-medium ml-0.5">명</span></p>
                  </div>
                  <!-- 식사 완료 카드 (클릭 가능) -->
                  <div id="card-ate" class="p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition border border-gray-100 shadow-sm ${window.statViewMode === 'ate' ? 'bg-blue-600 text-white ring-2 ring-blue-600 shadow-blue-200' : 'bg-gray-50/60 text-gray-800 hover:bg-gray-100'}">
                    <p class="text-xs font-bold opacity-75 mb-1">식사 완료</p>
                    <p class="text-2xl md:text-3xl font-extrabold"><span id="stat-ate-count">0</span><span class="text-sm font-medium ml-0.5">명</span></p>
                  </div>
                  <!-- 미식사 카드 (클릭 가능) -->
                  <div id="card-not-ate" class="p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition border border-gray-100 shadow-sm ${window.statViewMode === 'notAte' ? 'bg-gray-900 text-white ring-2 ring-gray-900 shadow-gray-200' : 'bg-gray-50/60 text-gray-800 hover:bg-gray-100'}">
                    <p class="text-xs font-bold opacity-75 mb-1">미식사</p>
                    <p class="text-2xl md:text-3xl font-extrabold"><span id="stat-notate-count">0</span><span class="text-sm font-medium ml-0.5">명</span></p>
                  </div>
                </div>

                <div class="bg-gray-50/60 p-6 rounded-3xl shadow-sm border border-gray-100">
                  <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">오늘 석식 달성률</span>
                    <span id="stat-percent" class="text-sm font-extrabold text-blue-600">0%</span>
                  </div>
                  <div class="w-full bg-gray-200/80 h-3 rounded-full overflow-hidden">
                    <div id="stat-progress" class="bg-blue-600 h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
                  </div>
                </div>

                <div class="bg-gray-50/60 p-6 rounded-3xl shadow-sm border border-gray-100">
                  <h3 id="stat-list-title" class="font-extrabold text-gray-900 mb-4">명단</h3>
                  <div id="stat-list-container" class="flex flex-wrap gap-2.5 max-h-[300px] overflow-y-auto"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 학생 정보 수정 모달 -->
          <div id="edit-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl animate-in fade-in zoom-in-95">
              <div class="flex justify-between items-center mb-6">

      function switchAdminTab(tabName) {
        window.activeAdminTab = tabName;
        renderAdminDashboard();
      }

      function setupAdminListeners() {
        document.getElementById('logout-btn').addEventListener('click', () => {
          currentUser = null;
          renderLogin();
          showToast('로그아웃 되었습니다.');
        });

        const addForm = document.getElementById('add-student-form');
        if (addForm) {
          addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('new-id').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const password = document.getElementById('new-pw').value.trim();
            
            const checkedDays = Array.from(document.querySelectorAll('input[name="study-day"]:checked')).map(el => parseInt(el.value));

            if (allUsers.some(u => u.id === id)) {
              showToast('이미 등록된 학번입니다.', 'error');
              return;
            }

            try {
              const { db, firebaseModules } = window;
              const { collection, addDoc } = firebaseModules;
              const usersRef = collection(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', 'meal_users');
              await addDoc(usersRef, { id, name, password, role: 'student', studyDays: checkedDays });
              showToast('학생이 성공적으로 등록되었습니다.');
              addForm.reset();
            } catch (err) {
              showToast('학생 등록에 실패했습니다.', 'error');
              console.error(err);
            }
          });
        }

        const editForm = document.getElementById('edit-student-form');
        if (editForm) {
          editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const docId = document.getElementById('edit-doc-id').value;
            const name = document.getElementById('edit-name').value.trim();
            const password = document.getElementById('edit-pw').value.trim();
            const checkedDays = Array.from(document.querySelectorAll('input[name="edit-study-day"]:checked')).map(el => parseInt(el.value));

            try {
              const { db, firebaseModules } = window;
              const { doc, updateDoc } = firebaseModules;
              const userRef = doc(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', 'meal_users', docId);
              await updateDoc(userRef, { name, password, studyDays: checkedDays });
              showToast('학생 정보가 수정되었습니다.');
              closeEditModal();
            } catch (err) {
              showToast('수정 실패', 'error');
              console.error(err);
            }
          });
        }

        const cardTarget = document.getElementById('card-target');
        const cardAte = document.getElementById('card-ate');
        const cardNotAte = document.getElementById('card-not-ate');

        if (cardTarget) cardTarget.addEventListener('click', () => { window.statViewMode = 'target'; updateAdminStatsAndLists(); });
        if (cardAte) cardAte.addEventListener('click', () => { window.statViewMode = 'ate'; updateAdminStatsAndLists(); });
        if (cardNotAte) cardNotAte.addEventListener('click', () => { window.statViewMode = 'notAte'; updateAdminStatsAndLists(); });

        const toggleCamBtn = document.getElementById('toggle-cam-btn');
        if (toggleCamBtn) {
          toggleCamBtn.addEventListener('click', () => {
            if (window.isScanning) {
              stopCamera();
            } else {
              startCamera();
            }
          });
        }

        const manualBtn = document.getElementById('manual-scan-submit');
        if (manualBtn) {
          manualBtn.addEventListener('click', () => {
            const val = document.getElementById('manual-scan-input').value.trim();
            if (val) processScanData(val);
          });
        }
      }

      window.openEditModal = function(docId) {
        const student = allUsers.find(u => u.docId === docId);
        if (!student) return;

        document.getElementById('edit-doc-id').value = student.docId;
        document.getElementById('edit-id').value = student.id;
        document.getElementById('edit-name').value = student.name;
        document.getElementById('edit-pw').value = student.password;

        const dayCheckboxes = document.querySelectorAll('input[name="edit-study-day"]');
        dayCheckboxes.forEach(cb => {
          cb.checked = (student.studyDays || []).includes(parseInt(cb.value));
        });

        document.getElementById('edit-modal').classList.remove('hidden');
      };

      window.closeEditModal = function() {
        document.getElementById('edit-modal').classList.add('hidden');
      };

      function updateAdminStatsAndLists() {
        const students = allUsers.filter(u => u.role === 'student');
        const studentCountEl = document.getElementById('student-count');
        if (studentCountEl) studentCountEl.textContent = students.length;

        const dayOfWeek = getTodayDayOfWeek();
        const targetStudents = students.filter(s => s.studyDays && s.studyDays.includes(dayOfWeek));
        
        const ateCount = todayAttendance.length;
        const targetCount = targetStudents.length;
        const notAteTargetStudents = targetStudents.filter(s => !todayAttendance.some(a => a.studentId === s.id));
        const notAteCount = notAteTargetStudents.length;

        const statTargetCount = document.getElementById('stat-target-count');
        const statAteCount = document.getElementById('stat-ate-count');
        const statNotateCount = document.getElementById('stat-notate-count');
        if (statTargetCount) statTargetCount.textContent = targetCount;
        if (statAteCount) statAteCount.textContent = ateCount;
        if (statNotateCount) statNotateCount.textContent = notAteCount;

        const percent = targetCount === 0 ? 0 : Math.min(100, Math.round((ateCount / targetCount) * 100));
        const statPercent = document.getElementById('stat-percent');
        const statProgress = document.getElementById('stat-progress');
        if (statPercent) statPercent.textContent = percent + '%';
        if (statProgress) statProgress.style.width = percent + '%';

        const cTarget = document.getElementById('card-target');

        const cNotAte = document.getElementById('card-not-ate');
        if (cTarget && cAte && cNotAte) {
          cTarget.className = `p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition border border-gray-100 shadow-sm ${window.statViewMode === 'target' ? 'bg-indigo-600 text-white ring-2 ring-indigo-600 shadow-indigo-200' : 'bg-gray-50/60 text-gray-800 hover:bg-gray-100'}`;
          cAte.className = `p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition border border-gray-100 shadow-sm ${window.statViewMode === 'ate' ? 'bg-blue-600 text-white ring-2 ring-blue-600 shadow-blue-200' : 'bg-gray-50/60 text-gray-800 hover:bg-gray-100'}`;
          cNotAte.className = `p-5 md:p-6 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition border border-gray-100 shadow-sm ${window.statViewMode === 'notAte' ? 'bg-gray-900 text-white ring-2 ring-gray-900 shadow-gray-200' : 'bg-gray-50/60 text-gray-800 hover:bg-gray-100'}`;
        }

        const studentListEl = document.getElementById('student-list-container');
        if (studentListEl) {
          if (students.length === 0) {
            studentListEl.innerHTML = `<p class="text-xs font-bold text-gray-400 text-center py-6">등록된 학생이 없습니다.</p>`;
          } else {
            studentListEl.innerHTML = students.map(s => `
              <div class="flex justify-between items-center p-3.5 bg-white rounded-2xl border border-gray-100">
                <div>
                  <p class="font-extrabold text-sm text-gray-900">${s.name} <span class="text-xs font-medium text-gray-400 ml-1">(${s.id})</span></p>
                  <p class="text-[11px] font-semibold text-blue-600 mt-0.5">자습요일: ${(s.studyDays || []).map(d => ['', '월','화','수','목','금','토','일'][d]).join(', ') || '없음'}</p>
                </div>
                <div class="flex items-center gap-1.5">
                  <button onclick="openEditModal('${s.docId}')" class="w-8 h-8 rounded-xl bg-gray-50 border border-gray-200 text-gray-500 hover:text-blue-600 hover:border-blue-200 flex items-center justify-center transition" title="수정">
                    <i class="fa-solid fa-pen text-xs"></i>
                  </button>
                  <button onclick="deleteStudent('${s.docId}')" class="w-8 h-8 rounded-xl bg-gray-50 border border-gray-200 text-gray-400 hover:text-red-500 hover:border-red-200 flex items-center justify-center transition" title="삭제">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                  </button>
                </div>
              </div>
            `).join('');
          }
        }

        const listTitleEl = document.getElementById('stat-list-title');
        const listContainerEl = document.getElementById('stat-list-container');
        if (listTitleEl && listContainerEl) {
          if (window.statViewMode === 'target') {
            listTitleEl.innerHTML = `<i class="fa-solid fa-list-check text-indigo-600 mr-1.5"></i> 오늘 자습 대상 학생 명단 (${targetCount}명)`;
            if (targetStudents.length === 0) {
              listContainerEl.innerHTML = `<p class="text-xs font-bold text-gray-400 py-4 w-full text-center">오늘(주말 또는 요일 해당 없음) 자습 예정인 학생이 없습니다.</p>`;
            } else {
              listContainerEl.innerHTML = targetStudents.map(s => {
                const hasAte = todayAttendance.some(a => a.studentId === s.id);
                return `
                  <span class="px-3.5 py-2 rounded-xl text-xs font-bold border flex items-center gap-2 ${hasAte ? 'bg-blue-50 text-blue-800 border-blue-200' : 'bg-white text-gray-700 border-gray-200 shadow-sm'}">
                    <span class="w-2 h-2 rounded-full ${hasAte ? 'bg-blue-600' : 'bg-gray-300'}"></span>
                    ${s.name} (${s.id})
                  </span>
                `;
              }).join('');
            }
          } else if (window.statViewMode === 'ate') {
            listTitleEl.innerHTML = `<i class="fa-solid fa-circle-check text-blue-600 mr-1.5"></i> 식사 완료 학생 명단 (${ateCount}명)`;
            if (todayAttendance.length === 0) {
              listContainerEl.innerHTML = `<p class="text-xs font-bold text-gray-400 py-4 w-full text-center">아직 식사한 학생이 없습니다.</p>`;
            } else {
              listContainerEl.innerHTML = todayAttendance.map(a => {
                const s = students.find(st => st.id === a.studentId);
                if (!s) return '';
                return `
                  <span class="px-3.5 py-2 bg-blue-50 text-blue-800 border border-blue-200 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm">
                    ${s.name} (${s.id})
                    <button onclick="cancelAttendance('${a.docId}')" class="text-blue-400 hover:text-red-500 ml-1"><i class="fa-solid fa-xmark"></i></button>
                  </span>
                `;
              }).join('');
            }
          } else {
            listTitleEl.innerHTML = `<i class="fa-solid fa-user-clock text-gray-800 mr-1.5"></i> 미식사 학생 명단 (${notAteCount}명)`;
            if (notAteTargetStudents.length === 0) {
              listContainerEl.innerHTML = `<p class="text-xs font-bold text-green-600 py-4 w-full text-center">오늘 자습 대상자가 모두 식사를 완료했습니다! 🎉</p>`;
            } else {
              listContainerEl.innerHTML = notAteTargetStudents.map(s => `
                <span class="px-3.5 py-2 bg-white text-gray-700 border border-gray-200 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm">
                  <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                  ${s.name} (${s.id})
                </span>
              `).join('');
            }
          }
        }

      window.deleteStudent = async function(docId) {
        if (!confirm('정말 이 학생 정보를 삭제하시겠습니까?')) return;
        try {
          const { db, firebaseModules } = window;
          const { doc, deleteDoc } = firebaseModules;
          await deleteDoc(doc(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', 'meal_users', docId));
          showToast('학생 정보가 삭제되었습니다.');
        } catch (err) {
          showToast('삭제 실패', 'error');
        }
      };

      window.cancelAttendance = async function(docId) {
        try {
          const { db, firebaseModules } = window;
          const { doc, deleteDoc } = firebaseModules;
          const todayStr = getTodayStr();
          await deleteDoc(doc(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', `meal_attendance_${todayStr}`, docId));
          showToast('식사 기록이 취소되었습니다.');
        } catch (err) {
          showToast('취소 실패', 'error');
        }
      };

      let videoStream = null;
      window.isScanning = false;
      let pendingStudentObj = null;

      function startCamera() {
        const video = document.getElementById('qr-video');
        const box = document.getElementById('camera-box');
        const placeholder = document.getElementById('camera-placeholder');
        const btn = document.getElementById('toggle-cam-btn');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            videoStream = stream;
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            box.classList.remove('hidden');
            placeholder.classList.add('hidden');
            btn.textContent = '카메라 끄기';
            btn.className = "w-full py-4 bg-red-50 hover:bg-red-100 text-red-600 font-extrabold rounded-2xl transition border border-red-200";
            window.isScanning = true;
            requestAnimationFrame(scanTick);
          })
          .catch(err => {
            showToast('카메라 권한이 거부되었거나 지원하지 않는 기기입니다.', 'error');
          });
      }

      function stopCamera() {
        if (videoStream) {
          videoStream.getTracks().forEach(track => track.stop());
          videoStream = null;
        }
        window.isScanning = false;
        const box = document.getElementById('camera-box');
        const placeholder = document.getElementById('camera-placeholder');
        const btn = document.getElementById('toggle-cam-btn');
        if (box) box.classList.add('hidden');
        if (placeholder) placeholder.classList.remove('hidden');
        if (btn) {
          btn.textContent = '카메라 켜기';
          btn.className = "w-full py-4 bg-gray-900 hover:bg-gray-800 text-white font-extrabold rounded-2xl transition shadow-md";
        }
      }

      function scanTick() {
        if (!window.isScanning) return;
        const video = document.getElementById('qr-video');
        const canvas = document.getElementById('qr-canvas');
        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

          if (code) {
            processScanData(code.data);
            return;
          }
        }
        requestAnimationFrame(scanTick);
      }

      function processScanData(data) {
        try {
          stopCamera();
          const decoded = atob(data);
          const [studentId, timeStr] = decoded.split('|');
          const timeWindow = parseInt(timeStr, 10);
          const currentWindow = Math.floor(Date.now() / 60000);

          if (currentWindow - timeWindow > 2 || currentWindow < timeWindow) {
            showToast('만료되었거나 유효하지 않은 QR코드입니다.', 'error');
            return;
          }

          const student = allUsers.find(u => u.role === 'student' && u.id === studentId);
          if (!student) {
            showToast('등록되지 않은 학생입니다.', 'error');
            return;
          }

          if (todayAttendance.some(a => a.studentId === studentId)) {
            showToast(`이미 식사를 완료한 학생입니다! (${student.name})`, 'error');
            return;
          }

          pendingStudentObj = student;
          document.getElementById('scanner-view-container').classList.add('hidden');
          const pCard = document.getElementById('pending-card');
          pCard.classList.remove('hidden');
          document.getElementById('pending-name').textContent = student.name + ' 학생';
          document.getElementById('pending-id').textContent = '학번: ' + student.id;

          document.getElementById('confirm-eat-btn').onclick = confirmMeal;
          document.getElementById('cancel-eat-btn').onclick = cancelPendingMeal;

        } catch (e) {
          showToast('올바르지 않은 QR 데이터 형식입니다.', 'error');
        }
      }

      async function confirmMeal() {
        if (!pendingStudentObj) return;
        try {
          const { db, firebaseModules } = window;
          const { collection, addDoc } = firebaseModules;
          const todayStr = getTodayStr();
          const attRef = collection(db, 'artifacts', 'smart_meal_pass_v1', 'public', 'data', `meal_attendance_${todayStr}`);
          await addDoc(attRef, { studentId: pendingStudentObj.id, timestamp: Date.now() });
          
          showToast(`${pendingStudentObj.name} 식사 완료 처리되었습니다!`);
          resetPendingCard();
        } catch (err) {
          showToast('처리 중 오류가 발생했습니다.', 'error');
        }
      }

      function cancelPendingMeal() {
        resetPendingCard();
        showToast('취소되었습니다.');
      }

      function resetPendingCard() {
        pendingStudentObj = null;
        document.getElementById('pending-card').classList.add('hidden');
        document.getElementById('scanner-view-container').classList.remove('hidden');
        document.getElementById('manual-scan-input').value = '';
      }

                  </div>
                  <p class="font-extrabold text-lg mb-1">자습 대상 요일이 아닙니다</p>
                  <p class="text-xs font-semibold text-amber-700 mt-1">오늘은 <span class="underline">${currentDayName}</span>이며, 설정된 자습 요일이 아닙니다.</p>
                </div>
              ` : hasAte ? `
                <div class="w-full bg-blue-50 border border-blue-100 rounded-3xl p-8 flex flex-col items-center text-blue-900 animate-in fade-in">
                  <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center mb-4 shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-check text-2xl"></i>
                  </div>
                  <p class="font-extrabold text-lg mb-1">식사 확인 완료</p>
                  <p class="text-xs font-semibold text-blue-600">맛있게 드세요! 😊</p>
                </div>
              ` : `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 mb-6 ring-4 ring-blue-50">
                  <img id="qr-img" src="" alt="QR" class="w-52 h-52 object-contain rounded-2xl" />
                </div>

                <div class="w-full">
                  <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-400">QR 유효 시간</span>
                    <span id="qr-timer" class="text-sm font-extrabold text-blue-600">60초</span>
                  </div>
                  <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                    <div id="qr-progress" class="bg-blue-600 h-full transition-all duration-1000 linear" style="width: 100%"></div>
                  </div>
                </div>
                <p class="mt-6 text-[11px] font-semibold text-gray-400 bg-white px-4 py-2.5 rounded-xl w-full border border-gray-100 shadow-sm">
                  보안을 위해 1분마다 코드가 자동으로 갱신됩니다.
                </p>
              `}
            </div>
          </div>
        `;

        if (isStudyDay && !hasAte) {
          startQrTimer();
        }
      }

      window.studentLogout = function() {
        currentUser = null;
        renderLogin();
        showToast('로그아웃 되었습니다.');
      };

      let qrInterval = null;
      function startQrTimer() {
        if (qrInterval) clearInterval(qrInterval);

        const updateQr = () => {
          if (!currentUser || todayAttendance.some(a => a.studentId === currentUser.id)) return;
          const currentMinute = Math.floor(Date.now() / 60000);
          const rawData = `${currentUser.id}|${currentMinute}`;
          const encoded = btoa(rawData);
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(encoded)}&margin=1`;
          
          const img = document.getElementById('qr-img');
          if (img && img.src !== qrUrl) img.src = qrUrl;

          const secLeft = 60 - (new Date().getSeconds());
          const timerEl = document.getElementById('qr-timer');
          const progEl = document.getElementById('qr-progress');
          if (timerEl) timerEl.textContent = secLeft + '초';
          if (progEl) progEl.style.width = (secLeft / 60) * 100 + '%';
        };

        updateQr();
        qrInterval = setInterval(updateQr, 1000);
      }
    </script>
</body>
</html>
