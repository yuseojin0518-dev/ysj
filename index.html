<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center justify-start selection:bg-blue-200">

      <span id="toast-msg"></span>

    <div id="app" class="w-full max-w-full md:max-w-6xl min-h-screen flex flex-col bg-white md:bg-transparent shadow-sm md:shadow-none md:p-6 md:py-10">

    <script>
      let currentUser = null;
      let allUsers = [];
      let todayAttendance = [];
      let unsubscribeUsers = null;
      let unsubscribeAttendance = null;

      const getTodayStr = () => {
        const d = new Date();
        return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      };
      const getTodayDayOfWeek = () => new Date().getDay(); 

      function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').textContent = msg;
        document.getElementById('toast-icon').innerHTML = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
        toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3.5 rounded-2xl shadow-xl z-[999] text-white font-bold transition-all duration-300 opacity-100 text-sm flex items-center gap-2.5 ${type === 'success' ? 'bg-blue-600' : 'bg-red-500'}`;
        setTimeout(() => { toast.classList.replace('opacity-100', 'opacity-0'); }, 3000);
      }

      window.addEventListener('firebase-ready', async () => {
        const { auth, db, firebaseModules } = window;
        const { collection, onSnapshot } = firebaseModules;

        try { await window.auth.signInAnonymously(auth); } catch (e) { console.error("Auth error", e); }

        const usersRef = collection(db, 'meal_users');
        unsubscribeUsers = onSnapshot(usersRef, (snapshot) => {
          allUsers = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
          if (currentUser) {
            const updatedUser = allUsers.find(u => u.id === currentUser.id);
            if(updatedUser) currentUser = updatedUser; 
            renderApp();
          } else {
            renderLogin();
          }
        });

        const todayStr = getTodayStr();
        const attRef = collection(db, `meal_attendance_${todayStr}`);
        unsubscribeAttendance = onSnapshot(attRef, (snapshot) => {
          todayAttendance = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
          if (currentUser) renderApp();
        });
      });

      function renderLogin() {
        const appEl = document.getElementById('app');
        appEl.innerHTML = `
          <div class="min-h-screen md:min-h-[85vh] flex flex-col items-center justify-center p-6 bg-white md:bg-transparent">
            <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl md:shadow-xl w-full max-w-md border border-gray-100">

                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">스마트 석식 패스</h1>

              </div>

              <form id="login-form" class="space-y-5">
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-2 ml-1 uppercase tracking-wider">학번</label>
                  <input type="text" id="login-id" class="w-full px-5 py-4 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800 transition text-lg" placeholder="학번 입력 (예: 30101)" required autocomplete="off" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-2 ml-1 uppercase tracking-wider">비밀번호</label>
                  <input type="password" id="login-pw" class="w-full px-5 py-4 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-gray-800 transition text-lg" placeholder="비밀번호 입력 (초기: 0000)" required />
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-extrabold text-lg py-4.5 rounded-2xl shadow-lg shadow-blue-200 transition mt-4">
                  로그인
                </button>
              </form>
            </div>
          </div>
        `;

        document.getElementById('login-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const id = document.getElementById('login-id').value.trim();
          const pw = document.getElementById('login-pw').value.trim();

          if (id === 'ysj0518' && pw === 'ysj0518!') {
            currentUser = { role: 'admin', name: '관리자 선생님', id: 'ysj0518' };
            renderApp();
            showToast('관리자 계정으로 로그인되었습니다.');
            return;
          }

          const student = allUsers.find(u => u.role === 'student' && u.id === id && u.password === pw);
          if (student) {
            currentUser = student;
            renderApp();
            showToast(`${student.name} 학생 환영합니다!`);
          } else {
            showToast('학번 또는 비밀번호가 일치하지 않습니다.', 'error');
          }
        });
      }

      function renderApp() {
        if (!currentUser) { renderLogin(); return; }
        if (currentUser.role === 'admin') {
          renderAdminDashboard();
        } else {
          renderStudentDashboard();
        }
      }

      let videoStream = null;
      window.isScanning = false;
      let pendingStudentObj = null;

      function startCamera() {
        const video = document.getElementById('qr-video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
            videoStream = stream;
            video.srcObject = stream;
            video.play();
            document.getElementById('camera-box').classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.add('hidden');
            const btn = document.getElementById('toggle-cam-btn');
            btn.innerHTML = '<i class="fa-solid fa-video-slash mr-2"></i>카메라 끄기';
            btn.className = "w-full md:w-2/3 py-5 bg-red-50 hover:bg-red-100 text-red-600 font-extrabold text-lg rounded-2xl transition border-2 border-red-200";
            window.isScanning = true;
            requestAnimationFrame(scanTick);
          }).catch(err => showToast('카메라 접근 권한이 없습니다.', 'error'));
      }
      function stopCamera() {
        if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }
        window.isScanning = false;
        if(document.getElementById('camera-box')) document.getElementById('camera-box').classList.add('hidden');
        if(document.getElementById('camera-placeholder')) document.getElementById('camera-placeholder').classList.remove('hidden');
        const btn = document.getElementById('toggle-cam-btn');
        if(btn) { 
          btn.innerHTML = '카메라 켜기'; 
          btn.className = "w-full md:w-2/3 py-5 bg-gray-900 hover:bg-gray-800 text-white font-extrabold text-lg rounded-2xl transition shadow-lg active:scale-95"; 
        }
      }
      function scanTick() {
        if (!window.isScanning) return;
        const video = document.getElementById('qr-video');
        const canvas = document.getElementById('qr-canvas');
        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
          if (code) { processScanData(code.data); return; }
        }
        requestAnimationFrame(scanTick);
      }
      function processScanData(data) {
        try {
          stopCamera();
          const [studentId, timeStr] = atob(data).split('|');
          const timeWindow = parseInt(timeStr, 10);
          const currentWindow = Math.floor(Date.now() / 60000);
          
          if (currentWindow - timeWindow > 1 || currentWindow < timeWindow) { showToast('만료된 QR코드입니다. (캡처본 의심)', 'error'); return; }

          const student = allUsers.find(u => u.role === 'student' && u.id === studentId);
          if (!student) { showToast('등록되지 않은 학생입니다.', 'error'); return; }

          const dayOfWeek = getTodayDayOfWeek();
          if (!(student.studyDays || []).includes(dayOfWeek)) { 
            showToast(`오늘은 ${student.name} 학생의 자습 요일이 아닙니다.`, 'error'); return; 
          }
          
          if (todayAttendance.some(a => a.studentId === studentId)) { 
            showToast(`이미 식사한 학생입니다! (${student.name})`, 'error'); return; 
          }

          pendingStudentObj = student;
          document.getElementById('scanner-view-container').classList.add('hidden');
          document.getElementById('pending-card').classList.remove('hidden');
          document.getElementById('pending-name').textContent = student.name;
          document.getElementById('pending-id').textContent = '학번: ' + student.id;
          
          document.getElementById('confirm-eat-btn').onclick = async () => {
            try {
              const { db, firebaseModules } = window;
              const { collection, addDoc } = firebaseModules;
              const todayStr = getTodayStr();
              await addDoc(collection(db, `meal_attendance_${todayStr}`), { studentId: pendingStudentObj.id, timestamp: Date.now() });
              showToast(`${pendingStudentObj.name} 확인 완료!`);
              resetPendingCard();
            } catch (err) { showToast('처리 오류', 'error'); }
          };
          document.getElementById('cancel-eat-btn').onclick = resetPendingCard;
        } catch (e) { showToast('잘못된 QR코드 형식입니다.', 'error'); }
      }
      function resetPendingCard() {
        pendingStudentObj = null;
        document.getElementById('pending-card').classList.add('hidden');
        document.getElementById('scanner-view-container').classList.remove('hidden');
      }

      function renderStudentDashboard() {
        const appEl = document.getElementById('app');
        const hasAte = todayAttendance.some(a => a.studentId === currentUser.id);
        const dayOfWeek = getTodayDayOfWeek();
        const isStudyDay = (currentUser.studyDays || []).includes(dayOfWeek);
        const dayNames = ['', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
        const currentDayName = dayNames[dayOfWeek] || '오늘';

        appEl.innerHTML = `
          <div class="min-h-screen md:min-h-[85vh] flex flex-col items-center justify-center p-6 bg-white md:bg-transparent mb-8 w-full max-w-md mx-auto">
            <header class="w-full flex justify-between items-center mb-8">
              <div>
                <h1 class="font-extrabold text-gray-900 text-xl tracking-tight">스마트 패스</h1>
                <p class="text-xs text-gray-400 font-bold mt-1">모바일 식사권</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openStudentPwModal()" class="px-3.5 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl font-bold text-xs shadow-sm hover:bg-gray-50 transition flex items-center">
                  <i class="fa-solid fa-key mr-1.5 text-blue-600"></i> 비밀번호 변경
                </button>
                <button onclick="studentLogout()" class="w-10 h-10 flex items-center justify-center bg-gray-50 border border-gray-200 text-gray-600 rounded-xl hover:bg-gray-100 transition">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
              </div>
            </header>

            <div class="bg-white md:bg-gray-50/50 md:border md:border-gray-100 p-8 rounded-[3rem] shadow-2xl shadow-gray-200/60 w-full flex flex-col items-center text-center relative overflow-hidden">
              <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-[100px] -z-10"></div>
              
              <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-blue-600 mb-5 shadow-sm border border-gray-100">
                <i class="fa-solid fa-user-graduate text-3xl"></i>
              </div>
              <h2 class="text-2xl font-extrabold text-gray-900 mb-1">${currentUser.name}</h2>
              <p class="text-sm font-bold text-gray-400 mb-10 bg-gray-50 px-4 py-1.5 rounded-full border border-gray-100">학번: ${currentUser.id}</p>

              ${!isStudyDay ? `
                <div class="w-full bg-amber-50 border border-amber-200 rounded-[2rem] p-8 flex flex-col items-center text-amber-900 animate-in zoom-in-95">
                  <div class="w-16 h-16 bg-amber-500 text-white rounded-full flex items-center justify-center mb-5 shadow-lg shadow-amber-200">
                    <i class="fa-solid fa-calendar-xmark text-2xl"></i>
                  </div>
                  <p class="font-extrabold text-xl mb-2">자습 대상 요일이 아닙니다</p>
                  <p class="text-sm font-semibold text-amber-700">오늘은 <span class="underline font-bold">${currentDayName}</span>입니다.</p>
                </div>
              ` : hasAte ? `
                <div class="w-full bg-blue-50 border border-blue-200 rounded-[2rem] p-8 flex flex-col items-center text-blue-900 animate-in zoom-in-95">
                  <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center mb-5 shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-check text-3xl"></i>
                  </div>
                  <p class="font-extrabold text-xl mb-2">식사 확인 완료</p>
                  <p class="text-sm font-semibold text-blue-600">맛있게 드세요! 😊</p>
                </div>
              ` : `
                <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 mb-8 relative ring-[6px] ring-blue-50/50">
                  <img id="qr-img" src="" alt="QR" class="w-56 h-56 object-contain rounded-xl" />
                  <div class="absolute inset-0 pointer-events-none bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCI+PHRleHQgeD0iMCIgeT0iNDAiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9InJnYmEoMCwwLDAsMC4wNCkiIHRyYW5zZm9ybT0icm90YXRlKC00NSkiPkNPUFkgUFJPVEVDVEVEPC90ZXh0Pjwvc3ZnPg==')] opacity-100 mix-blend-multiply rounded-xl"></div>
                </div>
                
                <div class="w-full max-w-[220px]">
                  <div class="flex justify-between items-center mb-2.5">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">QR 유효 시간</span>
                    <div class="flex items-baseline gap-0.5">
                      <span id="qr-timer" class="text-xl font-extrabold text-blue-600 tabular-nums">60</span>
                      <span class="text-xs font-bold text-gray-400">초</span>
                    </div>
                  </div>
                  <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden">
                    <div id="qr-progress" class="bg-blue-600 h-full transition-all duration-1000 linear" style="width: 100%"></div>
                  </div>
                </div>
                <p class="mt-8 text-[11px] text-gray-400 font-bold bg-gray-50 px-5 py-3 rounded-2xl w-full text-center">캡처된 화면은 식사 확인이 불가능합니다.</p>
              `}
            </div>
          </div>

          <!-- 학생 본인 비밀번호 변경 모달 -->
          <div id="student-pw-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl animate-in fade-in zoom-in-95">
              <div class="flex justify-between items-center mb-6">
                <h3 class="font-extrabold text-xl text-gray-900">비밀번호 변경</h3>
                <button onclick="closeStudentPwModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center transition">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
              <form onsubmit="changeStudentPassword(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">현재 비밀번호</label>
                  <input type="password" id="pw-old" class="w-full px-5 py-4 bg-gray-50 rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" required placeholder="예: 0000" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">새 비밀번호</label>
                  <input type="password" id="pw-new" class="w-full px-5 py-4 bg-gray-50 rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" required placeholder="새로운 비밀번호 입력" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">새 비밀번호 확인</label>
                  <input type="password" id="pw-new-confirm" class="w-full px-5 py-4 bg-gray-50 rounded-xl border border-gray-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500" required placeholder="다시 한번 입력" />
                </div>
                <button type="submit" class="w-full mt-4 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition text-lg">완료</button>
              </form>
            </div>
          </div>
        `;

        if (isStudyDay && !hasAte) startQrTimer();
      }

      window.openStudentPwModal = function() {
        document.getElementById('pw-old').value = ''; document.getElementById('pw-new').value = ''; document.getElementById('pw-new-confirm').value = '';
        document.getElementById('student-pw-modal').classList.remove('hidden');
      };
      window.closeStudentPwModal = function() { document.getElementById('student-pw-modal').classList.add('hidden'); };
      
      window.changeStudentPassword = async function(e) {
        e.preventDefault();
        const oldPw = document.getElementById('pw-old').value;
        const newPw = document.getElementById('pw-new').value;
        const confirmPw = document.getElementById('pw-new-confirm').value;

        if (oldPw !== currentUser.password) { showToast('현재 비밀번호가 맞지 않습니다.', 'error'); return; }
        if (newPw !== confirmPw) { showToast('새 비밀번호가 서로 일치하지 않습니다.', 'error'); return; }
        if (newPw.length < 4) { showToast('비밀번호는 최소 4자리 이상이어야 합니다.', 'error'); return; }

        try {
          const { db, firebaseModules } = window;
          const { doc, updateDoc } = firebaseModules;
          await updateDoc(doc(db, 'meal_users', currentUser.docId), { password: newPw });
          
          showToast('비밀번호가 성공적으로 변경되었습니다! 🎉');
          currentUser.password = newPw; 
          closeStudentPwModal();
        } catch (err) { showToast('비밀번호 변경 실패. 다시 시도해주세요.', 'error'); }
      };

      window.studentLogout = function() {
        if (qrInterval) clearInterval(qrInterval);
        currentUser = null;
        renderLogin();
        showToast('로그아웃 되었습니다.');
      };

      let qrInterval = null;
      function startQrTimer() {
        if (qrInterval) clearInterval(qrInterval);
        const updateQr = () => {
          if (!currentUser || todayAttendance.some(a => a.studentId === currentUser.id)) { clearInterval(qrInterval); return; }
          
          const currentMinute = Math.floor(Date.now() / 60000);
          const encoded = btoa(`${currentUser.id}|${currentMinute}`);
          const url = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(encoded)}&margin=0`;
          
          const img = document.getElementById('qr-img');
          if (img && img.src !== url) img.src = url;
          
          const secLeft = 60 - (new Date().getSeconds());
          const timerEl = document.getElementById('qr-timer');
          const progEl = document.getElementById('qr-progress');
          
          if(timerEl) timerEl.textContent = secLeft;
          if(timerEl) timerEl.className = `text-xl font-extrabold tabular-nums ${secLeft <= 10 ? 'text-red-500' : 'text-blue-600'}`;
          
          if(progEl) {
            progEl.style.width = (secLeft / 60) * 100 + '%';
            progEl.className = `h-full transition-all duration-1000 linear ${secLeft <= 10 ? 'bg-red-500' : 'bg-blue-600'}`;
          }
        };
        updateQr();
        qrInterval = setInterval(updateQr, 1000);
      }
    </script>
</body>
</html>
